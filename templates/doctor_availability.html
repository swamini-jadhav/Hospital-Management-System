<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Provide Availability</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <h2>Logo</h2>
        </div>
        <div class="nav-icons">
            <ul>
                <li>Contact</li>
            </ul>
        </div>
    </nav>
</header>

<main>
    <div id="pageC">
        <div class="container">

            <h2>Set Your Weekly Availability</h2>
            <p>Dr. {{ doctor.FirstName }} {{ doctor.LastName }}</p>

            <form method="POST">

                <table border="1" cellspacing="0" cellpadding="10" class="appointments-table">
                    <tr>
                        <th>Date</th>
                        <th>Morning (08:00 - 12:00)</th>
                        <th>Evening (04:00 - 09:00)</th>
                    </tr>

                    {% for day, slots in availability %}
                    <tr>
                        <td>{{ day }}</td>

                        <!-- slots[0] = morning, slots[1] = evening -->
                        <td>
                            <input type="checkbox" name="slot{{ loop.index0 }}m"
                                   {% if slots[0] == 1 %}checked{% endif %}>
                        </td>
                        <td>
                            <input type="checkbox" name="slot{{ loop.index0 }}e"
                                   {% if slots[1] == 1 %}checked{% endif %}>
                        </td>
                    </tr>
                    {% endfor %}
                </table>

                <button type="submit" class="save" style="margin-top: 20px;">SAVE</button>

            </form>

            <div class="just-back-save">
                <a href="{{ url_for('doctor_dashboard', doctorID=doctor.DoctorID) }}">
                    <button class="back">BACK</button>
                </a>
            </div>

        </div>
    </div>
</main>

</body>
</html>
